name: Supabase security lint

# Fails the build if the Supabase database linter reports any new
# security finding (ERROR or WARN) that is not already in
# .github/security/lint-baseline.json.
#
# Required GitHub repo secrets:
#   SUPABASE_ACCESS_TOKEN  Personal access token (Supabase dashboard → Account → Access Tokens)
#   SUPABASE_PROJECT_REF   Project ref (e.g. ukmtzflxtcoqnwujvrqh)
#
# To enforce as a merge gate: Settings → Branches → Branch protection
# → Required status checks → select "supabase-security-lint".

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".github/security/lint-baseline.json"
      - ".github/workflows/supabase-security-lint.yml"
      - "scripts/check-supabase-lint.mjs"
  push:
    branches: [main]
  schedule:
    # Daily catch-all in case of out-of-band DB changes.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  supabase-security-lint:
    name: supabase-security-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Supabase linter gate
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # The secret wins; otherwise the project this repo deploys to.
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'qfowcjyueonpwmxzthmz' }}
        run: |
          # Tolerate a secret pasted with spaces, a newline, or the token twice over.
          SUPABASE_ACCESS_TOKEN=$(printf '%s' "$RAW_TOKEN" | grep -o 'sbp_[0-9a-f]\{40\}' | head -n1 || true)
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          export SUPABASE_ACCESS_TOKEN
          node scripts/check-supabase-lint.mjs
