name: Supabase setup

# Applies database migrations and deploys the practice-ai edge function to the
# hosted Supabase project. Needs one repository secret: SUPABASE_ACCESS_TOKEN
# (Supabase → Account → Access Tokens). No database password is needed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/practice-ai/**"

concurrency:
  group: supabase-setup
  cancel-in-progress: false

env:
  PROJECT_REF: qfowcjyueonpwmxzthmz

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the access token secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/supabase-apply-migrations.mjs "$PROJECT_REF"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy practice-ai edge function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy practice-ai --project-ref "$PROJECT_REF" --use-api
