name: Supabase setup

# Applies database migrations and deploys the practice-ai edge function to the
# hosted Supabase project. Needs one repository secret: SUPABASE_ACCESS_TOKEN
# (Supabase → Account → Access Tokens). No database password is needed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/practice-ai/**"

concurrency:
  group: supabase-setup
  cancel-in-progress: false

env:
  PROJECT_REF: qfowcjyueonpwmxzthmz

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read the access token secret
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Tolerate a secret pasted with spaces, a newline, or the token twice over.
          TOKEN=$(printf '%s' "$RAW_TOKEN" | grep -o 'sbp_[0-9a-f]\{40\}' | head -n1 || true)
          if [ -z "$TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing or not an sbp_ token. Set it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "SUPABASE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Apply migrations
        run: node scripts/supabase-apply-migrations.mjs "$PROJECT_REF"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy practice-ai edge function
        run: supabase functions deploy practice-ai --project-ref "$PROJECT_REF" --use-api
