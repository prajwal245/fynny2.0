<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="AI reads, code proves, people approve">
  <rect width="1200" height="440" rx="28" fill="#FAF7F2"/>
  <text x="600" y="58" font-size="28" font-weight="700" text-anchor="middle" fill="#141210">AI reads. Code proves. People approve.</text>
  <g>
    <rect x="48" y="96" width="336" height="300" rx="22" fill="#FFFFFF" stroke="#141210" stroke-opacity=".1" stroke-width="2"/>
    <circle cx="96" cy="146" r="26" fill="#D92B2B"/><text x="96" y="156" font-size="26" font-weight="700" text-anchor="middle" fill="#fff">1</text>
    <text x="136" y="154" font-size="26" font-weight="700" fill="#141210">AI reads</text>
    <g font-size="19" fill="#141210" fill-opacity=".78"><text x="80" y="212">Bank PDFs and scans</text><text x="80" y="246">Tally and Zoho exports</text><text x="80" y="280">GST and 26AS reports</text></g>
    <text x="80" y="354" font-size="18" font-weight="600" fill="#8E1B1F">Turns documents into lines.</text>
    <text x="80" y="378" font-size="18" fill="#141210" fill-opacity=".6">Never decides a match.</text>
  </g>
  <path d="M392 246 h24" stroke="#8E1B1F" stroke-width="4" stroke-linecap="round"/><path d="M408 234 l14 12 l-14 12" stroke="#8E1B1F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="432" y="96" width="336" height="300" rx="22" fill="#141210"/>
    <circle cx="480" cy="146" r="26" fill="#D92B2B"/><text x="480" y="156" font-size="26" font-weight="700" text-anchor="middle" fill="#fff">2</text>
    <text x="520" y="154" font-size="26" font-weight="700" fill="#FAF7F2">Code proves</text>
    <g font-size="19" fill="#FAF7F2" fill-opacity=".86"><text x="464" y="212">Opening + movement = closing</text><text x="464" y="246">Each line used once</text><text x="464" y="280">Each match nets to zero</text><text x="464" y="314">Same result on a re-run</text></g>
    <text x="464" y="372" font-size="18" font-weight="600" fill="#EADBC8">Arithmetic, not opinion.</text>
  </g>
  <path d="M776 246 h24" stroke="#8E1B1F" stroke-width="4" stroke-linecap="round"/><path d="M792 234 l14 12 l-14 12" stroke="#8E1B1F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="816" y="96" width="336" height="300" rx="22" fill="#FFFFFF" stroke="#141210" stroke-opacity=".1" stroke-width="2"/>
    <circle cx="864" cy="146" r="26" fill="#D92B2B"/><text x="864" y="156" font-size="26" font-weight="700" text-anchor="middle" fill="#fff">3</text>
    <text x="904" y="154" font-size="26" font-weight="700" fill="#141210">People approve</text>
    <g font-size="19" fill="#141210" fill-opacity=".78"><text x="848" y="212">Exceptions for a person</text><text x="848" y="246">Ledger map confirmed</text><text x="848" y="280">Partner signs the MIS</text><text x="848" y="314">Month locked, logged</text></g>
    <text x="848" y="372" font-size="18" font-weight="600" fill="#8E1B1F">Judgement stays human.</text>
  </g>
</svg>
