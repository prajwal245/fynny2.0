<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-label="Three ways to get a Tally export out of a cloud or remote desktop session into FynHelp">
<title>Three ways to get a Tally export out of a cloud or remote desktop session into FynHelp</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8A1E18"/></marker></defs>
<rect width="1200" height="500" rx="22" fill="#F7F2EA"/>
<text x="40" y="44" font-size="20" font-weight="700" fill="#171208">Tally on Cloud or remote desktop: three ways out</text><rect x="40" y="90" width="300" height="170" rx="16" fill="#fff" stroke="#E2D9CB" stroke-width="2"/><text x="190.0" y="165.0" text-anchor="middle" font-size="19" font-weight="700" fill="#171208">Remote Tally session</text><text x="190.0" y="191.0" text-anchor="middle" font-size="15" fill="#6b6257">TallyPrime runs on a hosted</text><text x="190.0" y="212.0" text-anchor="middle" font-size="15" fill="#6b6257">Windows machine; you see it</text><text x="190.0" y="233.0" text-anchor="middle" font-size="15" fill="#6b6257">through Remote Desktop</text><text x="190" y="290" text-anchor="middle" font-size="15" fill="#6b6257">Export the XML inside the session</text><line x1="340" y1="175" x2="470" y2="125" stroke="#8A1E18" stroke-width="3" marker-end="url(#a)"/><rect x="470" y="70" width="330" height="110" rx="16" fill="#fff" stroke="#E2D9CB" stroke-width="2"/><text x="635.0" y="115.0" text-anchor="middle" font-size="19" font-weight="700" fill="#171208">1. Upload from inside</text><text x="635.0" y="141.0" text-anchor="middle" font-size="15" fill="#6b6257">open fynhelp.com in the</text><text x="635.0" y="162.0" text-anchor="middle" font-size="15" fill="#6b6257">session's browser and upload</text><line x1="800" y1="125" x2="900" y2="175" stroke="#8A1E18" stroke-width="3" marker-end="url(#a)"/><line x1="340" y1="175" x2="470" y2="255" stroke="#8A1E18" stroke-width="3" marker-end="url(#a)"/><rect x="470" y="200" width="330" height="110" rx="16" fill="#fff" stroke="#E2D9CB" stroke-width="2"/><text x="635.0" y="245.0" text-anchor="middle" font-size="19" font-weight="700" fill="#171208">2. Shared local drive</text><text x="635.0" y="271.0" text-anchor="middle" font-size="15" fill="#6b6257">save to your own PC's drive,</text><text x="635.0" y="292.0" text-anchor="middle" font-size="15" fill="#6b6257">shared into the session</text><line x1="800" y1="255" x2="900" y2="175" stroke="#8A1E18" stroke-width="3" marker-end="url(#a)"/><line x1="340" y1="175" x2="470" y2="385" stroke="#8A1E18" stroke-width="3" marker-end="url(#a)"/><rect x="470" y="330" width="330" height="110" rx="16" fill="#fff" stroke="#E2D9CB" stroke-width="2"/><text x="635.0" y="375.0" text-anchor="middle" font-size="19" font-weight="700" fill="#171208">3. Email it in</text><text x="635.0" y="401.0" text-anchor="middle" font-size="15" fill="#6b6257">email the file from the</text><text x="635.0" y="422.0" text-anchor="middle" font-size="15" fill="#6b6257">session to the firm inbox</text><line x1="800" y1="385" x2="900" y2="175" stroke="#8A1E18" stroke-width="3" marker-end="url(#a)"/><rect x="900" y="100" width="260" height="150" rx="16" fill="#fff" stroke="#8A1E18" stroke-width="2"/><text x="1030.0" y="165.0" text-anchor="middle" font-size="19" font-weight="700" fill="#171208">FynHelp</text><text x="1030.0" y="191.0" text-anchor="middle" font-size="15" fill="#6b6257">the file lands under</text><text x="1030.0" y="212.0" text-anchor="middle" font-size="15" fill="#6b6257">the right client</text><text x="40" y="470" font-size="15" fill="#6b6257">Which route works depends on what your hosting provider allows: a browser in the session, drive sharing, or email.</text></svg>