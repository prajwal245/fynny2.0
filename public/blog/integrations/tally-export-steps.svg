<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-label="Exporting a bank ledger from TallyPrime in five steps">
<title>Exporting a bank ledger from TallyPrime in five steps</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8A1E18"/></marker></defs>
<rect width="1200" height="340" rx="22" fill="#F7F2EA"/>
<text x="40" y="44" font-size="20" font-weight="700" fill="#171208">Exporting a bank ledger from TallyPrime</text><rect x="40" y="80" width="210" height="190" rx="16" fill="#fff" stroke="#E2D9CB" stroke-width="2"/><circle cx="70" cy="110" r="15" fill="#8A1E18"/><text x="70" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text><text x="145.0" y="165.0" text-anchor="middle" font-size="19" font-weight="700" fill="#171208">Open the ledger</text><text x="145.0" y="191.0" text-anchor="middle" font-size="15" fill="#6b6257">Gateway of Tally →</text><text x="145.0" y="212.0" text-anchor="middle" font-size="15" fill="#6b6257">Display More Reports →</text><text x="145.0" y="233.0" text-anchor="middle" font-size="15" fill="#6b6257">Account Books → Ledger</text><line x1="250" y1="175" x2="272" y2="175" stroke="#8A1E18" stroke-width="3" marker-end="url(#a)"/><rect x="272" y="80" width="210" height="190" rx="16" fill="#fff" stroke="#E2D9CB" stroke-width="2"/><circle cx="302" cy="110" r="15" fill="#8A1E18"/><text x="302" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text><text x="377.0" y="165.0" text-anchor="middle" font-size="19" font-weight="700" fill="#171208">Pick the bank</text><text x="377.0" y="191.0" text-anchor="middle" font-size="15" fill="#6b6257">Select the client's</text><text x="377.0" y="212.0" text-anchor="middle" font-size="15" fill="#6b6257">bank ledger, for example</text><text x="377.0" y="233.0" text-anchor="middle" font-size="15" fill="#6b6257">HDFC Current A/c</text><line x1="482" y1="175" x2="504" y2="175" stroke="#8A1E18" stroke-width="3" marker-end="url(#a)"/><rect x="504" y="80" width="210" height="190" rx="16" fill="#fff" stroke="#E2D9CB" stroke-width="2"/><circle cx="534" cy="110" r="15" fill="#8A1E18"/><text x="534" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text><text x="609.0" y="165.0" text-anchor="middle" font-size="19" font-weight="700" fill="#171208">Set the month</text><text x="609.0" y="191.0" text-anchor="middle" font-size="15" fill="#6b6257">Press Alt+F2 and enter</text><text x="609.0" y="212.0" text-anchor="middle" font-size="15" fill="#6b6257">the first and last day</text><text x="609.0" y="233.0" text-anchor="middle" font-size="15" fill="#6b6257">of the month</text><line x1="714" y1="175" x2="736" y2="175" stroke="#8A1E18" stroke-width="3" marker-end="url(#a)"/><rect x="736" y="80" width="210" height="190" rx="16" fill="#fff" stroke="#E2D9CB" stroke-width="2"/><circle cx="766" cy="110" r="15" fill="#8A1E18"/><text x="766" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">4</text><text x="841.0" y="165.0" text-anchor="middle" font-size="19" font-weight="700" fill="#171208">Export</text><text x="841.0" y="191.0" text-anchor="middle" font-size="15" fill="#6b6257">Alt+E → Current →</text><text x="841.0" y="212.0" text-anchor="middle" font-size="15" fill="#6b6257">File Format: XML</text><text x="841.0" y="233.0" text-anchor="middle" font-size="15" fill="#6b6257">(Data Interchange)</text><line x1="946" y1="175" x2="968" y2="175" stroke="#8A1E18" stroke-width="3" marker-end="url(#a)"/><rect x="968" y="80" width="210" height="190" rx="16" fill="#8A1E18" stroke="#8A1E18" stroke-width="2"/><circle cx="998" cy="110" r="15" fill="#fff"/><text x="998" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#8A1E18">5</text><text x="1073.0" y="165.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Send to FynHelp</text><text x="1073.0" y="191.0" text-anchor="middle" font-size="15" fill="#fff">Upload on Documents,</text><text x="1073.0" y="212.0" text-anchor="middle" font-size="15" fill="#fff">or email it to the firm</text><text x="1073.0" y="233.0" text-anchor="middle" font-size="15" fill="#fff">inbox FynHelp reads</text><text x="40" y="310" font-size="15" fill="#6b6257">Excel (Spreadsheet) works too. XML keeps every voucher with its ledger lines and signs, so prefer it.</text></svg>