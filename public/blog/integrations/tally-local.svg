<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-label="Tally on one PC or on an office network, and how the export reaches FynHelp">
<title>Tally on one PC or on an office network, and how the export reaches FynHelp</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8A1E18"/></marker></defs>
<rect width="1200" height="610" rx="22" fill="#F7F2EA"/>
<text x="40" y="44" font-size="20" font-weight="700" fill="#171208">Tally on the firm's own computers</text><text x="40" y="90" font-size="17" font-weight="700" fill="#8A1E18">A. One PC</text><rect x="40" y="110" width="240" height="120" rx="16" fill="#fff" stroke="#E2D9CB" stroke-width="2"/><text x="160.0" y="160.0" text-anchor="middle" font-size="19" font-weight="700" fill="#171208">Tally PC</text><text x="160.0" y="186.0" text-anchor="middle" font-size="15" fill="#6b6257">TallyPrime and the</text><text x="160.0" y="207.0" text-anchor="middle" font-size="15" fill="#6b6257">client's company data</text><line x1="280" y1="170" x2="380" y2="170" stroke="#8A1E18" stroke-width="3" marker-end="url(#a)"/><text x="330.0" y="160.0" text-anchor="middle" font-size="14" font-weight="600" fill="#8A1E18">export</text><rect x="380" y="110" width="180" height="120" rx="16" fill="#fff" stroke="#E2D9CB" stroke-width="2"/><text x="470.0" y="160.0" text-anchor="middle" font-size="19" font-weight="700" fill="#171208">XML file</text><text x="470.0" y="186.0" text-anchor="middle" font-size="15" fill="#6b6257">saved on</text><text x="470.0" y="207.0" text-anchor="middle" font-size="15" fill="#6b6257">this PC</text><line x1="560" y1="170" x2="640" y2="170" stroke="#8A1E18" stroke-width="3" marker-end="url(#a)"/><rect x="640" y="110" width="180" height="120" rx="16" fill="#fff" stroke="#8A1E18" stroke-width="2"/><text x="730.0" y="160.0" text-anchor="middle" font-size="19" font-weight="700" fill="#171208">FynHelp</text><text x="730.0" y="186.0" text-anchor="middle" font-size="15" fill="#6b6257">upload or</text><text x="730.0" y="207.0" text-anchor="middle" font-size="15" fill="#6b6257">email in</text><text x="40" y="290" font-size="17" font-weight="700" fill="#8A1E18">B. Office network: one PC holds the data, the others connect to it</text><rect x="40" y="310" width="240" height="120" rx="16" fill="#fff" stroke="#E2D9CB" stroke-width="2"/><text x="160.0" y="360.0" text-anchor="middle" font-size="19" font-weight="700" fill="#171208">Tally server PC</text><text x="160.0" y="386.0" text-anchor="middle" font-size="15" fill="#6b6257">holds the company</text><text x="160.0" y="407.0" text-anchor="middle" font-size="15" fill="#6b6257">data for everyone</text><rect x="40" y="450" width="240" height="90" rx="16" fill="#fff" stroke="#E2D9CB" stroke-width="2"/><text x="160.0" y="485.0" text-anchor="middle" font-size="19" font-weight="700" fill="#171208">Staff PC 1</text><text x="160.0" y="511.0" text-anchor="middle" font-size="15" fill="#6b6257">TallyPrime client</text><rect x="300" y="450" width="240" height="90" rx="16" fill="#fff" stroke="#E2D9CB" stroke-width="2"/><text x="420.0" y="485.0" text-anchor="middle" font-size="19" font-weight="700" fill="#171208">Staff PC 2</text><text x="420.0" y="511.0" text-anchor="middle" font-size="15" fill="#6b6257">TallyPrime client</text><line x1="160" y1="450" x2="160" y2="435" stroke="#8A1E18" stroke-width="3" marker-end="url(#a)"/><line x1="420" y1="450" x2="250" y2="435" stroke="#8A1E18" stroke-width="3" marker-end="url(#a)"/><line x1="540" y1="495" x2="680" y2="495" stroke="#8A1E18" stroke-width="3" marker-end="url(#a)"/><text x="590.0" y="485.0" text-anchor="middle" font-size="14" font-weight="600" fill="#8A1E18">export</text><rect x="680" y="440" width="180" height="110" rx="16" fill="#fff" stroke="#E2D9CB" stroke-width="2"/><text x="770.0" y="485.0" text-anchor="middle" font-size="19" font-weight="700" fill="#171208">XML file</text><text x="770.0" y="511.0" text-anchor="middle" font-size="15" fill="#6b6257">on the PC that</text><text x="770.0" y="532.0" text-anchor="middle" font-size="15" fill="#6b6257">exported it</text><line x1="860" y1="495" x2="940" y2="495" stroke="#8A1E18" stroke-width="3" marker-end="url(#a)"/><rect x="940" y="440" width="180" height="110" rx="16" fill="#fff" stroke="#8A1E18" stroke-width="2"/><text x="1030.0" y="485.0" text-anchor="middle" font-size="19" font-weight="700" fill="#171208">FynHelp</text><text x="1030.0" y="511.0" text-anchor="middle" font-size="15" fill="#6b6257">upload or</text><text x="1030.0" y="532.0" text-anchor="middle" font-size="15" fill="#6b6257">email in</text><text x="40" y="585" font-size="15" fill="#6b6257">In both cases nothing is installed for FynHelp: the export is an ordinary Tally file.</text></svg>