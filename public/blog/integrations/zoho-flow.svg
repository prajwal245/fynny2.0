<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-label="How Zoho Books data reaches the MIS">
<title>How Zoho Books data reaches the MIS</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8A1E18"/></marker></defs>
<rect width="1200" height="420" rx="22" fill="#F7F2EA"/>
<rect x="40" y="70" width="250" height="130" rx="16" fill="#fff" stroke="#E2D9CB" stroke-width="2"/><text x="165.0" y="125.0" text-anchor="middle" font-size="19" font-weight="700" fill="#171208">Zoho Books</text><text x="165.0" y="151.0" text-anchor="middle" font-size="15" fill="#6b6257">client's organisation</text><text x="165.0" y="172.0" text-anchor="middle" font-size="15" fill="#6b6257">bank account ledger</text><line x1="290" y1="135" x2="400" y2="135" stroke="#8A1E18" stroke-width="3" marker-end="url(#a)"/><text x="345.0" y="125.0" text-anchor="middle" font-size="14" font-weight="600" fill="#8A1E18">read-only</text><rect x="400" y="70" width="250" height="130" rx="16" fill="#fff" stroke="#8A1E18" stroke-width="2"/><text x="525.0" y="125.0" text-anchor="middle" font-size="19" font-weight="700" fill="#171208">FynHelp</text><text x="525.0" y="151.0" text-anchor="middle" font-size="15" fill="#6b6257">books side for the month</text><text x="525.0" y="172.0" text-anchor="middle" font-size="15" fill="#6b6257">(one file per account)</text><rect x="400" y="240" width="250" height="110" rx="16" fill="#fff" stroke="#E2D9CB" stroke-width="2"/><text x="525.0" y="285.0" text-anchor="middle" font-size="19" font-weight="700" fill="#171208">Bank statement</text><text x="525.0" y="311.0" text-anchor="middle" font-size="15" fill="#6b6257">uploaded, emailed or</text><text x="525.0" y="332.0" text-anchor="middle" font-size="15" fill="#6b6257">sent on WhatsApp</text><line x1="525" y1="240" x2="525" y2="205" stroke="#8A1E18" stroke-width="3" marker-end="url(#a)"/><line x1="650" y1="135" x2="760" y2="135" stroke="#8A1E18" stroke-width="3" marker-end="url(#a)"/><rect x="760" y="70" width="190" height="130" rx="16" fill="#fff" stroke="#E2D9CB" stroke-width="2"/><text x="855.0" y="125.0" text-anchor="middle" font-size="19" font-weight="700" fill="#171208">Recon</text><text x="855.0" y="151.0" text-anchor="middle" font-size="15" fill="#6b6257">5 matching passes</text><text x="855.0" y="172.0" text-anchor="middle" font-size="15" fill="#6b6257">exceptions with reasons</text><line x1="950" y1="135" x2="1010" y2="135" stroke="#8A1E18" stroke-width="3" marker-end="url(#a)"/><rect x="1010" y="70" width="150" height="130" rx="16" fill="#8A1E18" stroke="#8A1E18" stroke-width="2"/><text x="1085.0" y="125.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">MIS</text><text x="1085.0" y="151.0" text-anchor="middle" font-size="15" fill="#fff">every figure</text><text x="1085.0" y="172.0" text-anchor="middle" font-size="15" fill="#fff">source-linked</text><text x="40" y="44" font-size="20" font-weight="700" fill="#171208">How Zoho Books data reaches the MIS</text><text x="40" y="395" font-size="15" fill="#6b6257">FynHelp only reads. Nothing is posted, edited or deleted in Zoho Books.</text></svg>